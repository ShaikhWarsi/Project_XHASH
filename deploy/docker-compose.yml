version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: trading-engine:latest
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ../.env
    environment:
      - UVICORN_WORKERS=4
      - UVICORN_BIND=0.0.0.0:8001
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - trading_data:/app/data
    networks:
      - trading_net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - trading_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - trading_net

  celery-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: trading-engine:latest
    restart: unless-stopped
    command: celery -A deploy.celery_config worker --concurrency=4 -Q hedge-fund,backtest,analysis,default
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - trading_data:/app/data
    networks:
      - trading_net

  celery-beat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: trading-engine:latest
    restart: unless-stopped
    command: celery -A deploy.celery_config beat
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trading_net

volumes:
  trading_data:
  redis_data:

networks:
  trading_net:
    driver: bridge
