name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: vitest
        run: npx vitest run --coverage.enabled=false

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pip install stockstats textblob
      - run: pytest tests/ --ignore=tests/api --ignore=tests/integrations --ignore=tests/analytics/test_skfolio_optimizer.py --ignore=tests/analytics/test_factors.py -x -q
